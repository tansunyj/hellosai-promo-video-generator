<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HellosAI 视频生成器</title><style>body{margin:0;background:#f4f7f5;color:#15211c;font-family:Microsoft YaHei,Arial}.top{height:70px;background:#fff;border-bottom:1px solid #dfe7e2;padding:0 30px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:900}.layout{max-width:1400px;margin:24px auto;padding:0 22px;display:grid;grid-template-columns:1fr 400px;gap:22px}.panel{background:#fff;border:1px solid #dfe7e2;border-radius:18px;padding:20px}.tools{display:flex;gap:10px;margin-bottom:14px}.tools input,.tools select,.tools button{height:40px;border:1px solid #d5dfd9;border-radius:9px;padding:0 10px}.tools input{flex:1}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:680px;overflow:auto}.item{border:1px solid #e0e7e2;border-radius:13px;padding:10px;display:grid;grid-template-columns:22px 55px 1fr;gap:8px;cursor:pointer}.item.on{border-color:#1c745d;background:#f1faf5}.item img{width:55px;height:55px;object-fit:contain;border-radius:8px;background:#f2f3f1}.name{font-size:13px;font-weight:800;line-height:1.4}.meta{font-size:11px;color:#75817c;margin-top:4px}.price{font-size:14px;font-weight:900;color:#c85c38;margin-top:4px}.button{width:100%;height:45px;background:#1c745d;color:#fff;border:0;border-radius:23px;font-weight:900;cursor:pointer}.button:disabled{opacity:.45}.status{margin-top:12px;padding:10px;background:#f0f6f2;border-radius:9px;font-size:12px;white-space:pre-wrap;word-break:break-word}@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:none}}

<script type="module">let all=[],picked=[],overrideIds=[],previewSequence=0,selectionRevision=0;let latestPreview=null;let exporting=false;const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cn=(...codes)=>String.fromCharCode(...codes);function updateExportButton(){const count=picked.length;$('go').disabled=exporting||count<1;$('go').textContent=exporting?'正在导出……':count?'合成并下载 MP4 视频':'请先选择商品';$('exportHint').textContent=count?'已选择 '+count+' 个商品（最多 10 个），合成后自动下载视频。':'选择商品后，可导出 MP4 视频与 PNG 封面。';$('selectionSummary').textContent='已选择 '+count+'/10 · 临时覆盖 '+overrideIds.length;}function statusLabel(p){return p.stockStatus==='available'?'有库存：'+esc(p.stock):p.stockStatus==='out-of-stock'?'缺货':p.stockStatus==='unknown'?'库存未知':'需人工确认库存'}function draw(){const q=$('q').value.toLowerCase(),c=$('cat').value,items=all.filter(p=>(!q||(p.shortTitle||'').toLowerCase().includes(q)||p.displayTitle.toLowerCase().includes(q)||p.rawTitle.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))&&(!c||p.category===c));$('list').innerHTML=items.map(p=>{const selected=picked.includes(p.id),blocked=!p.selectable,forced=overrideIds.includes(p.id);return '<div class="item '+(selected?'on':'')+'" data-id="'+p.id+'" title="'+esc(p.rawTitle)+'"><input type="checkbox" '+(selected?'checked':'')+' '+(blocked&&!forced?'disabled':'')+'>'+(p.image?'<img src="/public/assets/'+esc(p.image)+'">':'<div class="missing-image">待补充图片</div>')+'<div><div class="name">'+esc(p.shortTitle||p.displayTitle)+'</div><div class="meta">'+esc(p.category)+' · '+statusLabel(p)+'<br>'+esc(p.label)+'</div><div class="price">'+esc(p.price)+'</div>'+(blocked?'<button type="button" class="force-toggle" data-force="'+p.id+'">'+(forced?'取消临时允许':'临时允许渲染')+'</button>':'')+'</div></div>'}).join('');document.querySelectorAll('.item').forEach(e=>e.onclick=event=>{if(event.target.closest('.force-toggle'))return;const id=+e.dataset.id,p=all.find(item=>item.id===id);if(!p.selectable&&!overrideIds.includes(id))return;togglePick(id)});document.querySelectorAll('.force-toggle').forEach(button=>button.onclick=event=>{event.stopPropagation();const id=+button.dataset.force,p=all.find(item=>item.id===id);if(overrideIds.includes(id)){overrideIds=overrideIds.filter(value=>value!==id);picked=picked.filter(value=>value!==id)}else if(picked.length<10&&confirm('当前库存状态为 '+p.stockStatus+'。请确认当前商品可以展示后再渲染？')){overrideIds.push(id);picked.push(id)}selectionRevision++;draw();preview()})}function togglePick(id){if(picked.includes(id)){picked=picked.filter(value=>value!==id);overrideIds=overrideIds.filter(value=>value!==id)}else if(picked.length<10)picked.push(id);selectionRevision++;draw();preview()}function applyPreset(kind){let matching=[];if(kind==='ai'){const rules=[p=>/gpt|gtp|chatgpt/i.test(p.rawTitle+' '+p.category),p=>/claude/i.test(p.rawTitle+' '+p.category),p=>/cursor/i.test(p.rawTitle+' '+p.category),p=>/gemini/i.test(p.rawTitle+' '+p.category)];matching=rules.map(rule=>all.find(p=>p.selectable&&rule(p)&&/O社套餐|A社套餐|cursor|google/i.test(p.category)&&!/接马|接码|验证|已结束|勿下单/.test(p.rawTitle))).filter(Boolean)}else{const cats=[cn(37038,31665),cn(36134,21495)];matching=all.filter(p=>p.selectable&&cats.includes(p.category)).slice(0,6)}picked=matching.slice(0,10).map(p=>p.id);overrideIds=[];selectionRevision++;$('catalogNotice').textContent='已选择 '+matching.length+' 个有库存商品，请检查后再渲染。';draw();preview()}let previewTimer;function preview(){window.dispatchEvent(new Event('media-settings-updated'));$('infoFields').hidden=$('templateSelect').value!=='information';clearTimeout(previewTimer);previewSequence++;previewTimer=setTimeout(refreshVideoPreview,180);updateExportButton()}async function refreshVideoPreview(){const sequence=++previewSequence,revision=selectionRevision,ids=picked.slice(),forced=overrideIds.slice();try{const response=await fetch('/api/preview?revision='+revision,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({ids,overrideIds:forced,background:$('backgroundSelect').value,bgm:$('bgmSelect').value,template:$('templateSelect').value,hookTitle:$('hookTitle').value,hookSubtitle:$('hookSubtitle').value,infoCards:[$('infoCard1').value,$('infoCard2').value],outroBrand:$('outroBrand').value,outroText:$('outroText').value,showStoreUrl:$('showStoreUrl').checked,showFollowHint:$('showFollowHint').checked,durationMode:$('durationMode').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Preview failed');if(sequence!==previewSequence||revision!==selectionRevision)return;latestPreview=data.inputProps;if(window.updateVideoPreview)window.updateVideoPreview({...latestPreview,previewRevision:revision})}catch(error){if(sequence===previewSequence)$('status').textContent=error.message}}window.addEventListener('video-duration-updated',event=>{$('templateRevision').textContent='已加载：动态三段式 · '+event.detail.revision});window.addEventListener('video-duration-updated',event=>{const {seconds,count}=event.detail;const mixed=new Set(all.filter(p=>picked.includes(p.id)).map(p=>p.category)).size>3;$('catalogNotice').textContent=count?'预计时长 '+seconds.toFixed(1)+' 秒。'+(mixed?'涉及多个分类，建议按同一场景精选商品。':'请核对价格、套餐和售后说明。')+(count!==picked.length?' 部分商品已因库存状态变化排除。':''):''});window.addEventListener('video-preview-ready',()=>{if(latestPreview)window.updateVideoPreview(latestPreview)});$('q').oninput=draw;$('cat').onchange=draw;$('hookTitle').oninput=preview;$('hookTitle').onchange=preview;$('hookSubtitle').oninput=preview;$('hookSubtitle').onchange=preview;$('templateSelect').oninput=preview;$('templateSelect').onchange=preview;$('durationMode').oninput=preview;$('durationMode').onchange=preview;$('infoCard1').oninput=preview;$('infoCard1').onchange=preview;$('infoCard2').oninput=preview;$('infoCard2').onchange=preview;$('outroBrand').oninput=preview;$('outroBrand').onchange=preview;$('outroText').oninput=preview;$('outroText').onchange=preview;$('showStoreUrl').oninput=preview;$('showStoreUrl').onchange=preview;$('showFollowHint').oninput=preview;$('showFollowHint').onchange=preview;document.querySelectorAll('[data-preset]').forEach(button=>button.onclick=()=>{const kind=button.dataset.preset;if(kind==='clear'){picked=[];overrideIds=[];selectionRevision++;draw();preview()}else applyPreset(kind)});function addDownloadLink(info,label){

    };

    if(selection.folder==='background')background.value=selection.filename;
    if(selection.folder==='bgm')music.value=selection.filename;
    const syncAudio=()=>{
      audio.pause();
      if(music.value)audio.src='/public/assets/bgm/'+encodeURIComponent(music.value);
      else audio.removeAttribute('src');
      audioToggle.hidden=!music.value;audio.load();updateAudioButton();
    };
    background.onchange=()=>{updateBackgroundPreview();preview()};
    music.onchange=()=>{syncAudio();preview()};
    syncAudio();updateBackgroundPreview();preview();
  }catch(error){$('status').textContent=error.message}
}
let uploading=false;
$('uploadMedia').onclick=()=>{$('uploadMessage').textContent='';$('uploadDialog').showModal()};
$('cancelUpload').onclick=()=>{if(!uploading)$('uploadDialog').close()};
$('uploadDialog').oncancel=event=>{if(uploading)event.preventDefault()};
$('uploadType').onchange=()=>{
  const background=document.querySelector('input[name="uploadType"]:checked').value==='background';
  $('uploadFile').accept=background?'.png,.jpg,.jpeg,.webp':'.mp3,.wav,.m4a';
  $('uploadFile').value='';$('uploadMessage').textContent='';
  $('uploadHelp').textContent=background?'支持 PNG、JPG、WEBP，最大 20 MB。上传后自动选用；同名文件不会覆盖。':'支持 MP3、WAV、M4A，最大 50 MB。上传后自动选用；同名文件不会覆盖。';
};
$('uploadForm').onsubmit=async event=>{
  event.preventDefault();if(uploading)return;
  const file=$('uploadFile').files[0],folder=document.querySelector('input[name="uploadType"]:checked').value;
  if(!file)return;
  if(file.size>(folder==='background'?20:50)*1024*1024){$('uploadMessage').textContent='文件超过大小限制，请选择更小的文件。';return}
  uploading=true;
  for(const id of ['uploadType','uploadFile','cancelUpload','submitUpload'])$(id).disabled=true;
  $('submitUpload').textContent='正在上传……';$('uploadMessage').textContent='正在上传，请稍候……';
  try{
    const response=await fetch('/api/upload?type='+encodeURIComponent(folder)+'&name='+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'上传失败');
    await loadMedia(result);
    $('uploadDialog').close();$('uploadFile').value='';
    $('status').textContent='已上传并选用'+(folder==='background'?'背景图片：':'背景音乐：')+result.filename;
  }catch(error){$('uploadMessage').textContent=error.message}
  finally{
    uploading=false;
    for(const id of ['uploadType','uploadFile','cancelUpload','submitUpload'])$(id).disabled=false;
    $('submitUpload').textContent='上传并使用';
  }
};
